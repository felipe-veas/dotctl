name: CI

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9
        with:
          version: v2.8.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Test Suite
        run: make test

      - name: Git Operations Tests
        run: go test ./internal/gitops ./internal/cmd -run 'Test(PullRebase|Push|Clone|TrackedFiles|CLI.*Integration)' -count=1

  build:
    name: Build
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: make build

      - name: Go vet
        run: go vet ./...

      - name: Cross-build CLI targets
        run: |
          set -euo pipefail
          for goos in darwin linux; do
            for goarch in amd64 arm64; do
              echo "Building dotctl for ${goos}/${goarch}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -o "bin/dotctl-${goos}-${goarch}" ./cmd/dotctl
            done
          done

  goreleaser-check:
    name: GoReleaser Check
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Validate goreleaser config
        run: goreleaser check --config .goreleaser.yaml

      - name: Snapshot build (skip publish)
        run: goreleaser release --snapshot --skip=publish --clean --config .goreleaser.yaml
