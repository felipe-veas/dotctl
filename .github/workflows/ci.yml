name: CI

on:
  pull_request:
    branches: [ "main" ]
  merge_group:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  # pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.8.0

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Test Suite
        run: make test

      - name: Git Operations Tests
        run: go test ./internal/gitops ./internal/cmd -run 'Test(PullRebase|Push|Clone|TrackedFiles|CLI.*Integration)' -count=1

  build:
    name: Build
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Build
        run: make build

      - name: Go vet
        run: go vet ./...

      - name: Cross-build CLI targets
        run: |
          set -euo pipefail
          for goos in darwin linux; do
            for goarch in amd64 arm64; do
              echo "Building dotctl for ${goos}/${goarch}"
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -o "bin/dotctl-${goos}-${goarch}" ./cmd/dotctl
            done
          done

  goreleaser-check:
    name: GoReleaser Check
    if: ${{ !startsWith(github.head_ref || '', 'release-please--') }}
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'

      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          install-only: true

      - name: Validate goreleaser config
        run: goreleaser check --config .goreleaser.yaml

      - name: Snapshot build (skip publish)
        run: goreleaser release --snapshot --skip=publish --clean --config .goreleaser.yaml
